name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset)
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PversionCode=${{ github.run_number }}

      - name: Report failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.get('message') or fl.text or '').replace('\n', ' ')[:300]
                      print(f"::error title={tc.get('classname')}::{tc.get('name')}: {msg}")
          PY
          grep -rh "^e: " app/build 2>/dev/null | head -20 | sed 's/^/::error::/' || true

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VitalySpeak-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VitalySpeak-${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VitalySpeak build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
