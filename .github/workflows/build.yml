name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PversionCode=${{ github.run_number }}

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VitalySpeak-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VitalySpeak-${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VitalySpeak build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
